<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LankaGo Live Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #e2e8f0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .user-pulse-dot {
            width: 18px;
            height: 18px;
            background: #0284c7;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.8);
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.7); }
            70% { box-shadow: 0 0 0 14px rgba(2, 132, 199, 0); }
            100% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            padding: 4px;
        }
        .leaflet-popup-content {
            margin: 10px 14px;
            line-height: 1.4;
            font-size: 13px;
            color: #1a2b4c;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // Initialize OpenStreetMap centered on Sri Lanka
        var map = L.map('map', {
            zoomControl: false,
            attributionControl: true
        }).setView([7.8731, 80.7718], 8);

        // OpenStreetMap Tile Layer (100% Free, No API Key needed)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var userMarker = null;
        var destinationMarker = null;
        var routePolyline = null;
        var lastUserLat = null;
        var lastUserLng = null;

        var userIcon = L.divIcon({
            className: 'user-pulse-dot',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        // Called from Android Kotlin when GPS coordinates update
        function updateUserLocation(lat, lng, shouldCenter) {
            lastUserLat = lat;
            lastUserLng = lng;

            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
            } else {
                userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map)
                    .bindPopup('<b style="color:#0284c7;">📍 Your Current Location</b><br>Lat: ' + lat.toFixed(5) + '<br>Lng: ' + lng.toFixed(5))
                    .openPopup();
            }

            if (shouldCenter) {
                map.setView([lat, lng], 15, { animate: true });
            }
        }

        // Recenter to current user location
        function recenterToUser() {
            if (lastUserLat !== null && lastUserLng !== null) {
                map.setView([lastUserLat, lastUserLng], 15, { animate: true });
                if (userMarker) {
                    userMarker.openPopup();
                }
            }
        }

        // Plot destination and draw route line from user to destination
        function plotDestinationAndRoute(destLat, destLng, title, address) {
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
            }
            if (routePolyline) {
                map.removeLayer(routePolyline);
            }

            destinationMarker = L.marker([destLat, destLng]).addTo(map)
                .bindPopup('<b style="color:#e11d48;">🎯 ' + title + '</b><br>' + address)
                .openPopup();

            if (lastUserLat !== null && lastUserLng !== null) {
                routePolyline = L.polyline([
                    [lastUserLat, lastUserLng],
                    [destLat, destLng]
                ], {
                    color: '#0284c7',
                    weight: 5,
                    opacity: 0.85,
                    dashArray: '6, 8'
                }).addTo(map);

                var bounds = L.latLngBounds([
                    [lastUserLat, lastUserLng],
                    [destLat, destLng]
                ]);
                map.fitBounds(bounds, { padding: [80, 80] });
            } else {
                map.setView([destLat, destLng], 14, { animate: true });
            }
        }

        // Clear active route
        function clearRoute() {
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
                destinationMarker = null;
            }
            if (routePolyline) {
                map.removeLayer(routePolyline);
                routePolyline = null;
            }
            recenterToUser();
        }

        // Interactive Map Click
        map.on('click', function(e) {
            L.popup()
                .setLatLng(e.latlng)
                .setContent('<b>Selected Location</b><br>Lat: ' + e.latlng.lat.toFixed(5) + '<br>Lng: ' + e.latlng.lng.toFixed(5))
                .openOn(map);
        });
    </script>
</body>
</html>
